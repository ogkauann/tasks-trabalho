<!DOCTYPE html>
<html lang="en" data-theme="light">
    <head>
        <meta charset="UTF-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Document</title>

        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    
        <link href="https://fonts.googleapis.com/css2?family=Material+Icons"
        rel="stylesheet">

        <link rel="stylesheet" href="css/custom.css">
    </head>
    <body class="container">
    <hr class="mt-3">
<div class="row align-items-center">
    <div class="col fs-3">
        <i class="material-icons fs-2">nightlife</i> <strong>FIC BEBO</strong>
    </div>

    <div class="col text-end">
        <a class="btn btn-outline-dark" href="dashboard.html">
            <i class="material-icons">home</i> Dashboard
        </a>
        <a class="btn btn-outline-dark" href="clientes.html">
            <i class="material-icons">group</i> Clientes
        </a>
        <a class="btn btn-outline-dark" href="produtos.html">
            <i class="material-icons">liquor</i> Produtos
        </a>
        <a class="btn btn-outline-dark" href="pedidos.html">
            <i class="material-icons">shopping_cart</i>Pedidos
        </a>
        <a class="btn btn-outline-danger" href="#" data-bs-toggle="modal" data-bs-target="#confirmLogoutModal">
            <i class="material-icons">logout</i> Sair
        </a>

    </div>
</div>
<hr>
<section class="card card-body">
    <div class="d-flex justify-content-between">
        <h1>Clientes</h1>

        <span>
            <a href="#cadastro" data-bs-toggle="offcanvas" class="btn btn-primary">Novo Cliente</a>
        </span>
    </div>

    <div class="mb-3">
        <input type="text" id="searchInput" class="form-control" placeholder="Buscar clientes...">
    </div>

        
        <div class="offcanvas offcanvas-end" tabindex="-1" id="cadastro" aria-labelledby="offcanvasExampleLabel">
        <div class="offcanvas-header">
            <h5 class="offcanvas-title" id="offcanvasExampleLabel">Cadastro de Cliente</h5>
            <button type="button" class="btn-close" data-bs-dismiss="offcanvas" aria-label="Close"></button>
        </div>
        <div class="offcanvas-body">
            <form action="">
            <label for="nome">Nome</label>
            <input id="nome" class="form-control mb-3" 
                type="text" required
                placeholder="Digite aqui">

            <label for="email">Email</label>
            <input id="email" class="form-control mb-3" 
                type="email" required
                placeholder="Digite aqui">
                
            <label for="telefone">Telefone</label>
            <input id="telefone" class="form-control mb-3" 
                type="text" required
                placeholder="Digite aqui">
            
            <label for="endereco">Endereço</label>
            <textarea id="endereco" class="form-control mb-3" 
                placeholder="Digite aqui"></textarea>

            <label for="observacao">Observação</label>
            <textarea id="observacao" class="form-control mb-3" 
                placeholder="Digite aqui"></textarea>

            <button class="btn btn-primary w-100">
                PRONTO
            </button>
            </form>
        </div>
        </div>
    
    <table class="table table-striped table-hover">
        <thead class="table-dark">
            <tr>
                <th data-column="id">#ID <span class="material-icons sort-icon"></span></th>
                <th data-column="nome">Nome <span class="material-icons sort-icon"></span></th>
                <th data-column="email">Email <span class="material-icons sort-icon"></span></th>
                <th data-column="telefone">Telefone <span class="material-icons sort-icon"></span></th>
                <th data-column="endereco">Endereço <span class="material-icons sort-icon"></span></th>
                <th data-column="observacao">Observação <span class="material-icons sort-icon"></span></th>
                <th>Ações</th>
            </tr>
        </thead>
        <tbody id="clientes-tbody">
        </tbody>
    </table>

    <div class="d-flex justify-content-between align-items-center mt-3">
        <button id="prevPage" class="btn btn-secondary" disabled>Anterior</button>
        <span id="pageInfo"></span>
        <button id="nextPage" class="btn btn-secondary">Próximo</button>
    </div>
</section>


    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>

    <script src="js/clientes.js"></script>

    <button class="theme-toggle" onclick="toggleTheme()">
        <span class="material-icons">dark_mode</span>
    </button>

    <!-- Modal de Confirmação de Saída -->
<div class="modal fade" id="confirmLogoutModal" tabindex="-1" aria-labelledby="confirmLogoutModalLabel" aria-hidden="true">
  <div class="modal-dialog modal-sm modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="confirmLogoutModalLabel">Confirmação</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        Tem certeza que deseja sair?
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Não</button>
        <button type="button" class="btn btn-danger" id="confirmLogoutBtn">Sim</button>
      </div>
    </div>
  </div>
</div>

    <script>
        // Variáveis de paginação
        let currentPage = 1;
        const itemsPerPage = 10; // 10 registros por página

        function renderTabela(clientesParaExibir) {
            const tbody = document.getElementById('clientes-tbody');
            tbody.innerHTML = '';

            // Lógica de paginação
            const totalPages = Math.ceil(clientesParaExibir.length / itemsPerPage);
            const startIndex = (currentPage - 1) * itemsPerPage;
            const endIndex = startIndex + itemsPerPage;
            const clientesPaginados = clientesParaExibir.slice(startIndex, endIndex);

            clientesPaginados.forEach(cliente => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td>${cliente.id}</td>
                    <td>${cliente.nome}</td>
                    <td>${cliente.email}</td>
                    <td>${cliente.telefone}</td>
                    <td>${cliente.endereco}</td>
                    <td>${cliente.observacao}</td>
                    <td>
                        <button class="btn btn-sm btn-primary" onclick="editarCliente(${cliente.id})">
                            <i class="material-icons">edit</i>
                        </button>
                        <button class="btn btn-sm btn-danger" onclick="excluirCliente(${cliente.id})">
                            <i class="material-icons">delete</i>
                        </button>
                    </td>
                `;
                tbody.appendChild(tr);
            });

            // Atualizar informações de paginação
            document.getElementById('pageInfo').textContent = `Página ${currentPage} de ${totalPages}`;
            document.getElementById('prevPage').disabled = currentPage === 1;
            document.getElementById('nextPage').disabled = currentPage === totalPages;
        }

        // Event listeners para paginação
        document.getElementById('prevPage').addEventListener('click', () => {
            if (currentPage > 1) {
                currentPage--;
                renderTabela(clientes);
            }
        });

        document.getElementById('nextPage').addEventListener('click', () => {
            const totalPages = Math.ceil(clientes.length / itemsPerPage);
            if (currentPage < totalPages) {
                currentPage++;
                renderTabela(clientes);
            }
        });

        // Função para buscar clientes
        document.getElementById('searchInput').addEventListener('input', (e) => {
            const searchTerm = e.target.value.toLowerCase();
            const clientesFiltrados = clientes.filter(cliente => 
                cliente.nome.toLowerCase().includes(searchTerm) ||
                cliente.email.toLowerCase().includes(searchTerm) ||
                cliente.telefone.includes(searchTerm)
            );
            currentPage = 1; // Reset para primeira página ao buscar
            renderTabela(clientesFiltrados);
        });

        // Função para ordenar tabela
        document.querySelectorAll('th[data-column]').forEach(th => {
            th.addEventListener('click', () => {
                const column = th.dataset.column;
                const sortIcon = th.querySelector('.material-icons');
                
                // Alternar direção da ordenação
                const isAsc = sortIcon.textContent === 'arrow_upward';
                sortIcon.textContent = isAsc ? 'arrow_downward' : 'arrow_upward';
                
                // Ordenar clientes
                clientes.sort((a, b) => {
                    const aValue = a[column].toString().toLowerCase();
                    const bValue = b[column].toString().toLowerCase();
                    return isAsc ? 
                        bValue.localeCompare(aValue) : 
                        aValue.localeCompare(bValue);
                });
                
                renderTabela(clientes);
            });
        });

        // Função para alternar tema
        function toggleTheme() {
            const html = document.documentElement;
            const currentTheme = html.getAttribute('data-theme');
            const newTheme = currentTheme === 'light' ? 'dark' : 'light';
            html.setAttribute('data-theme', newTheme);
            
            const themeIcon = document.querySelector('.theme-toggle .material-icons');
            themeIcon.textContent = newTheme === 'light' ? 'dark_mode' : 'light_mode';
            
            // Salvar preferência no localStorage
            localStorage.setItem('theme', newTheme);
        }

        // Carregar tema salvo
        const savedTheme = localStorage.getItem('theme') || 'light';
        document.documentElement.setAttribute('data-theme', savedTheme);
        const themeIcon = document.querySelector('.theme-toggle .material-icons');
        themeIcon.textContent = savedTheme === 'light' ? 'dark_mode' : 'light_mode';

        // Confirmação de logout
        document.getElementById('confirmLogoutBtn').addEventListener('click', () => {
            window.location.href = 'index.html';
        });
    </script>
</body>
</html>
