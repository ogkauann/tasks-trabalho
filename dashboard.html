<!DOCTYPE html>
<html lang="en" data-theme="light">
    <head>
        <meta charset="UTF-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Document</title>

        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    
        <link href="https://fonts.googleapis.com/css2?family=Material+Icons"
        rel="stylesheet">

        <link rel="stylesheet" href="css/custom.css">
    </head>
    <body class="container">
    <hr class="mt-3">
<div class="row align-items-center">
    <div class="col fs-3">
        <i class="material-icons fs-2">nightlife</i> <strong>FIC BEBO</strong>
    </div>

    <div class="col text-end">
        <a class="btn btn-outline-dark" href="dashboard.html">
            <i class="material-icons">home</i> Dashboard
        </a>
        <a class="btn btn-outline-dark" href="clientes.html">
            <i class="material-icons">group</i> Clientes
        </a>
        <a class="btn btn-outline-dark" href="produtos.html">
            <i class="material-icons">liquor</i> Produtos
        </a>
        <a class="btn btn-outline-dark" href="pedidos.html">
            <i class="material-icons">shopping_cart</i>Pedidos
        </a>
        <a class="btn btn-outline-danger" href="#" data-bs-toggle="modal" data-bs-target="#confirmLogoutModal">
            <i class="material-icons">logout</i> Sair
        </a>

    </div>
</div>
<hr>
<section class="card card-body">
    <h1>Bem vindo</h1>
</section>

<button class="theme-toggle" onclick="toggleTheme()">
    <span class="material-icons">dark_mode</span>
</button>

<!-- Modal de Confirmação de Saída -->
<div class="modal fade" id="confirmLogoutModal" tabindex="-1" aria-labelledby="confirmLogoutModalLabel" aria-hidden="true">
  <div class="modal-dialog modal-sm modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="confirmLogoutModalLabel">Confirmação</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        Tem certeza que deseja sair?
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Não</button>
        <button type="button" class="btn btn-danger" id="confirmLogoutBtn">Sim</button>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
<script>
    // Função para alternar o tema
    function toggleTheme() {
        const html = document.documentElement;
        const currentTheme = html.getAttribute('data-theme');
        const newTheme = currentTheme === 'light' ? 'dark' : 'light';
        html.setAttribute('data-theme', newTheme);
        localStorage.setItem('theme', newTheme);
        
        // Atualiza o ícone
        const icon = document.querySelector('.theme-toggle .material-icons');
        icon.textContent = newTheme === 'light' ? 'dark_mode' : 'light_mode';
    }

    // Verifica o tema salvo ao carregar a página
    document.addEventListener('DOMContentLoaded', () => {
        const savedTheme = localStorage.getItem('theme') || 'light';
        document.documentElement.setAttribute('data-theme', savedTheme);
        const icon = document.querySelector('.theme-toggle .material-icons');
        icon.textContent = savedTheme === 'light' ? 'dark_mode' : 'light_mode';

        // Adiciona event listener para o botão 'Sim' da modal de logout
        document.getElementById('confirmLogoutBtn').addEventListener('click', () => {
            window.location.href = 'index.html'; // Redireciona para a página de login
        });
    });
</script>
</body>
</html>
